name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach private media. Prefer a synthetic or non-sensitive reproducer."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact localmedia command and sanitized filenames.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version
      description: Output of ffmpeg -version, first line only.
    validations:
      required: true
